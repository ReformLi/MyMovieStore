<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV 搜索</title>
    <!-- 标签页图标：显式声明 + 服务端 /favicon.ico 自动兜底（浏览器两种取法都覆盖） -->
    <link rel="icon" type="image/png" href="/favicon.ico">
    <link rel="shortcut icon" type="image/png" href="/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #2a2a2a;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            color: #FF6B35;
        }
        .subtitle {
            font-size: 13px;
            text-align: center;
            color: #999;
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            min-width: 0; /* 允许 flex 子项缩小 */
            height: 48px;
            border: none;
            border-radius: 10px;
            padding: 0 16px;
            font-size: 16px;
            background: #333;
            color: #fff;
            outline: none;
        }
        input[type="text"]::placeholder { color: #666; }
        input[type="text"]:focus { background: #3a3a3a; }
        button {
            height: 48px;
            padding: 0 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
             /* 新增这两行：防止按钮被挤压 + 强制文字不换行 */
            flex-shrink: 0;
            white-space: nowrap;
        }
        button:active { opacity: 0.7; }
        .btn-search {
            background: #FF6B35;
            color: #fff;
        }
        .btn-search:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }
        .history-section { margin-top: 8px; }
        .history-title {
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
        }
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chip {
            padding: 8px 14px;
            background: #333;
            border-radius: 20px;
            font-size: 13px;
            color: #ddd;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chip:active { background: #FF6B35; color: #fff; }
        .status {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            color: #4CAF50;
            min-height: 20px;
            transition: opacity 0.3s;
        }
        .status.error { color: #EF5350; }
        .status.hidden { opacity: 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>TV 搜索</h1>
        <p class="subtitle">输入关键词，搜索结果将显示在电视上</p>

        <div class="input-group">
            <input type="text" id="searchInput" placeholder="输入影片名称..." autofocus>
            <button class="btn-search" id="btnSearch" onclick="doSearch()">搜索</button>
        </div>

        <div class="history-section" id="historySection" style="display:none">
            <p class="history-title">搜索历史</p>
            <div class="chips" id="historyChips"></div>
        </div>

        <p class="status hidden" id="status"></p>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let history = JSON.parse(localStorage.getItem('tvSearchHistory') || '[]');
        const input = document.getElementById('searchInput');
        const btn = document.getElementById('btnSearch');
        const statusEl = document.getElementById('status');

        // 回车搜索
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doSearch();
        });

        function doSearch() {
            const query = input.value.trim();
            if (!query) return;
            btn.disabled = true;
            statusEl.textContent = '搜索中...';
            statusEl.className = 'status';

            fetch(API_BASE + '/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            })
            .then(r => r.json())
            .then(data => {
                if (data.ok) {
                    statusEl.textContent = '已发送到电视 ✓';
                    statusEl.className = 'status';
                    saveHistory(query);
                } else {
                    statusEl.textContent = '发送失败，请重试';
                    statusEl.className = 'status error';
                }
                btn.disabled = false;
            })
            .catch(err => {
                statusEl.textContent = '网络错误: ' + err.message;
                statusEl.className = 'status error';
                btn.disabled = false;
            });
        }

        function saveHistory(query) {
            history = history.filter(h => h !== query);
            history.unshift(query);
            if (history.length > 10) history = history.slice(0, 10);
            localStorage.setItem('tvSearchHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const section = document.getElementById('historySection');
            const chips = document.getElementById('historyChips');
            if (history.length === 0) {
                section.style.display = 'none';
                return;
            }
            section.style.display = 'block';
            chips.innerHTML = history.map(h =>
                '<span class="chip" onclick="searchHistory(\'' + h.replace(/'/g, "\\'") + '\')">' + h + '</span>'
            ).join('');
        }

        function searchHistory(query) {
            input.value = query;
            doSearch();
        }

        // 初始渲染
        renderHistory();
    </script>
</body>
</html>
